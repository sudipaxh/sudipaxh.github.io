    <script>
        // Configuration
        const DATA_URL = 'https://raw.githubusercontent.com/st3084907-jpg/sdata/refs/heads/main/source.json';
        const ITEMS_PER_PAGE = 30; // Increased to 30 for better desktop grid fill (fits 5 and 6 columns perfectly)
        const HERO_SLIDE_COUNT = 5;
        const SLIDER_INTERVAL = 5000;
        
        // State variables
        let allVideoData = [];
        let filteredData = [];
        let currentPage = 1;
        let totalPages = 1;
        let currentSlide = 0;
        let sliderTimer;
        let activeHoverPlayer = null;
        let activeHoverHls = null;
        
        // DOM Elements
        const gridContainer = document.getElementById('video-grid');
        const loadingState = document.getElementById('loading-state');
        const videoCount = document.getElementById('video-count');
        const searchInput = document.getElementById('searchInput');
        const sliderContainer = document.getElementById('hero-slider-container');
        const sliderIndicators = document.getElementById('slider-indicators');
        const paginationTop = document.getElementById('pagination-top');
        const paginationBottom = document.getElementById('pagination-bottom');

        // Fast Fisher-Yates Shuffle
        function shuffleArray(array) {
            let m = array.length, t, i;
            while (m) {
                i = Math.floor(Math.random() * m--);
                t = array[m];
                array[m] = array[i];
                array[i] = t;
            }
            return array;
        }

        // Initialize Application
        async function init() {
            try {
                // Fetch complete JSON dataset quickly
                const response = await fetch(DATA_URL, { cache: 'force-cache' });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const json = await response.json();
                
                // Check if data exists and is an array
                if (json && Array.isArray(json.data)) {
                    // We shuffle once on load to give a fresh feel
                    allVideoData = shuffleArray([...json.data]);
                } else {
                    allVideoData = [];
                }
                
                filteredData = [...allVideoData];
                
                calculatePagination();
                setupHeroSlider();
                renderPage(currentPage);
                
                // Reveal UI
                loadingState.classList.add('hidden');
                gridContainer.classList.remove('hidden');

            } catch (error) {
                console.error("Error loading data:", error);
                loadingState.innerHTML = `
                    <i class="fa-solid fa-circle-exclamation text-5xl text-red-500 mb-4 shadow-red-500/50"></i>
                    <p class="text-white text-xl font-bold">Failed to load video feed.</p>
                    <p class="text-sm mt-2 text-slate-400 text-center max-w-md">${error.message}<br>Please check your internet connection or the JSON source.</p>
                `;
            }
        }

        function setupHeroSlider() {
            if (allVideoData.length === 0) return;
            
            const sliderVideos = allVideoData.slice(0, HERO_SLIDE_COUNT);
            
            // Using DocumentFragment for highly optimized DOM insertion
            const slideFragment = document.createDocumentFragment();
            const dotFragment = document.createDocumentFragment();
            
            sliderVideos.forEach((video, index) => {
                const streamUrl = video.m3u8_links && video.m3u8_links.length > 0 ? video.m3u8_links[0] : '';
                
                const slide = document.createElement('div');
                slide.className = 'hero-slide';
                slide.innerHTML = `
                    <div class="absolute inset-0 w-full h-full">
                        <img src="${video.image_url}" alt="Featured" class="w-full h-full object-cover" loading="${index === 0 ? 'eager' : 'lazy'}">
                        <div class="absolute inset-0 hero-overlay"></div>
                        <div class="absolute inset-0 bg-black/20"></div>
                    </div>
                    <div class="absolute bottom-0 left-0 w-full p-6 md:p-16 lg:px-24 pb-20 flex flex-col items-start z-10">
                        <span class="px-3 py-1 bg-purple-500/20 backdrop-blur-md border border-purple-500/50 rounded-full text-[10px] sm:text-xs font-bold uppercase tracking-widest text-purple-200 mb-3 sm:mb-4">Trending Now</span>
                        <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold text-white mb-4 sm:mb-6 max-w-4xl leading-tight line-clamp-2 drop-shadow-lg">${video.title}</h1>
                        <button onclick="navigateToPlayer('${encodeURIComponent(video.title)}', '${encodeURIComponent(streamUrl)}')" class="px-6 py-2.5 sm:px-8 sm:py-3 bg-white text-black hover:bg-slate-200 rounded-full font-bold text-sm sm:text-lg flex items-center gap-3 transition-transform hover:scale-105 shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                            <i class="fa-solid fa-play"></i> Watch Now
                        </button>
                    </div>
                `;
                slideFragment.appendChild(slide);

                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${index === 0 ? 'bg-purple-500 w-8' : 'bg-white/30 hover:bg-white/50'}`;
                dot.onclick = () => goToSlide(index);
                dotFragment.appendChild(dot);
            });

            sliderContainer.innerHTML = '';
            sliderIndicators.innerHTML = '';
            sliderContainer.appendChild(slideFragment);
            sliderIndicators.appendChild(dotFragment);

            startSlider();
        }

        function goToSlide(index) {
            const numSlides = Math.min(HERO_SLIDE_COUNT, allVideoData.length);
            currentSlide = (index + numSlides) % numSlides;
            
            sliderContainer.style.transform = `translateX(-${currentSlide * 20}%)`;
            
            const dots = sliderIndicators.children;
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = i === currentSlide 
                    ? 'w-8 h-3 rounded-full transition-all duration-300 bg-purple-500' 
                    : 'w-3 h-3 rounded-full transition-all duration-300 bg-white/30 hover:bg-white/50';
            }
            resetSliderTimer();
        }

        function startSlider() { sliderTimer = setInterval(() => goToSlide(currentSlide + 1), SLIDER_INTERVAL); }
        function resetSliderTimer() { clearInterval(sliderTimer); startSlider(); }

        function calculatePagination() {
            totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
            if (totalPages === 0) totalPages = 1;
            if (currentPage > totalPages) currentPage = 1;
            
            // Format number nicely (e.g., "10,000")
            const formattedCount = new Intl.NumberFormat().format(filteredData.length);
            videoCount.innerHTML = `<i class="fa-solid fa-database text-purple-400 mr-1"></i> ${formattedCount} Videos Found`;
        }

        function renderPaginationControls() {
            const createControls = (containerId) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                
                if (totalPages <= 1) return;

                const frag = document.createDocumentFragment();

                // Previous Button
                const prevBtn = document.createElement('button');
                prevBtn.className = 'pagination-btn w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-md';
                prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left text-xs"></i>';
                prevBtn.disabled = currentPage === 1;
                prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; handlePageChange(); }};
                frag.appendChild(prevBtn);

                // Smart Page Numbers (handles thousands of pages cleanly)
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(totalPages, currentPage + 2);
                
                if (currentPage <= 3) endPage = Math.min(totalPages, 5);
                if (currentPage >= totalPages - 2) startPage = Math.max(1, totalPages - 4);

                if (startPage > 1) {
                    frag.appendChild(createPageBtn(1));
                    if (startPage > 2) {
                        const ellipsis = document.createElement('span');
                        ellipsis.className = 'text-slate-500 px-1 sm:px-2';
                        ellipsis.innerText = '...';
                        frag.appendChild(ellipsis);
                    }
                }

                for (let i = startPage; i <= endPage; i++) {
                    frag.appendChild(createPageBtn(i));
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        const ellipsis = document.createElement('span');
                        ellipsis.className = 'text-slate-500 px-1 sm:px-2';
                        ellipsis.innerText = '...';
                        frag.appendChild(ellipsis);
                    }
                    frag.appendChild(createPageBtn(totalPages));
                }

                // Next Button
                const nextBtn = document.createElement('button');
                nextBtn.className = 'pagination-btn w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-md';
                nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right text-xs"></i>';
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; handlePageChange(); }};
                frag.appendChild(nextBtn);

                container.appendChild(frag);
            };

            createControls('pagination-top');
            createControls('pagination-bottom');
        }

        function createPageBtn(pageNum) {
            const btn = document.createElement('button');
            btn.className = `pagination-btn w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-md text-xs sm:text-sm font-bold ${currentPage === pageNum ? 'active shadow-lg shadow-purple-500/30' : ''}`;
            btn.innerText = pageNum;
            btn.onclick = () => {
                currentPage = pageNum;
                handlePageChange();
            };
            return btn;
        }

        function handlePageChange() {
            // Stop any playing hover videos to free memory before destroying DOM
            stopActiveHoverPlay();
            renderPage(currentPage);
            // Smooth scroll back to top of the grid
            const gridHeaderOffset = document.querySelector('.content-row').offsetTop - 80;
            window.scrollTo({ top: gridHeaderOffset, behavior: 'smooth' });
        }

        function stopActiveHoverPlay() {
            if(activeHoverHls) {
                activeHoverHls.destroy();
                activeHoverHls = null;
            }
            if(activeHoverPlayer) {
                activeHoverPlayer.classList.remove('playing');
                activeHoverPlayer.pause();
                activeHoverPlayer.removeAttribute('src');
                activeHoverPlayer.load();
                activeHoverPlayer = null;
            }
        }

        function renderPage(page) {
            gridContainer.innerHTML = ''; 
            
            if(filteredData.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center text-slate-400 py-20">
                        <i class="fa-solid fa-search-minus text-4xl mb-4 opacity-50"></i>
                        <p class="text-lg">No videos found matching your search.</p>
                    </div>`;
                renderPaginationControls();
                return;
            }

            const startIndex = (page - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, filteredData.length);
            const pageData = filteredData.slice(startIndex, endIndex);

            // DocumentFragment prevents reflows until completely built
            const fragment = document.createDocumentFragment();

            pageData.forEach((video) => {
                const streamUrl = video.m3u8_links && video.m3u8_links.length > 0 ? video.m3u8_links[0] : '';
                const fallbackImg = "https://placehold.co/600x337/1e293b/ffffff?text=Preview+Not+Available";
                
                const card = document.createElement('div');
                card.className = 'video-card relative group cursor-pointer bg-[#131b2f] rounded-xl p-3 border border-white/5 flex flex-col h-full shadow-lg';
                
                card.innerHTML = `
                    <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-slate-800 mb-3 shrink-0">
                        <!-- Native Lazy Loading for Performance -->
                        <img src="${video.image_url}" 
                             onerror="this.onerror=null; this.src='${fallbackImg}';" 
                             alt="Thumbnail" 
                             loading="lazy"
                             class="video-thumbnail w-full h-full object-cover transition-all duration-500 absolute inset-0 z-10">
                        
                        <video class="hover-video" muted playsinline preload="none"></video>
                        
                        <div class="absolute bottom-2 right-2 bg-black/80 backdrop-blur-md text-white text-[10px] px-2 py-1 rounded font-bold uppercase tracking-wider border border-white/10 z-20">
                            HD
                        </div>
                        
                        <div class="play-button-overlay absolute inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-20">
                            <div class="w-12 h-12 bg-purple-500/90 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(139,92,246,0.5)] transform transition-transform group-hover:scale-110">
                                <i class="fa-solid fa-play text-white ml-1 text-lg"></i>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col justify-between z-20 bg-[#131b2f]">
                        <h3 class="text-sm font-semibold text-slate-200 line-clamp-2 leading-snug group-hover:text-purple-400 transition-colors" title="${video.title.replace(/"/g, '&quot;')}">
                            ${video.title}
                        </h3>
                    </div>
                `;

                // Setup Hover Player Logic
                const videoEl = card.querySelector('.hover-video');
                let hoverTimeout;

                const startHoverPlay = () => {
                    hoverTimeout = setTimeout(() => {
                        if (streamUrl && Hls.isSupported()) {
                            stopActiveHoverPlay(); // Clear previous immediately
                            
                            activeHoverHls = new Hls({ debug: false, autoStartLoad: true, startLevel: -1 });
                            activeHoverHls.loadSource(streamUrl);
                            activeHoverHls.attachMedia(videoEl);
                            activeHoverPlayer = videoEl;
                            
                            activeHoverHls.on(Hls.Events.MANIFEST_PARSED, () => {
                                videoEl.play().then(() => {
                                    videoEl.classList.add('playing');
                                }).catch(e => console.log("Hover play interrupted", e));
                            });
                        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                             videoEl.src = streamUrl;
                             videoEl.play().then(()=> videoEl.classList.add('playing')).catch(e=>{});
                        }
                    }, 400); // 400ms delay to prevent spamming network on fast mouse moves
                };

                const clearHover = () => {
                    clearTimeout(hoverTimeout);
                    if(activeHoverPlayer === videoEl) {
                        stopActiveHoverPlay();
                    } else {
                        // Reset if it didn't fully initialize
                        videoEl.classList.remove('playing');
                        videoEl.pause();
                    }
                };

                // Event Listeners (Desktop + Mobile)
                card.addEventListener('mouseenter', startHoverPlay);
                card.addEventListener('mouseleave', clearHover);
                card.addEventListener('touchstart', startHoverPlay, {passive: true});
                card.addEventListener('touchend', clearHover, {passive: true});
                card.addEventListener('touchcancel', clearHover, {passive: true});

                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    clearHover();
                    navigateToPlayer(video.title, streamUrl);
                });

                fragment.appendChild(card);
            });

            // Single DOM write for maximum performance
            gridContainer.appendChild(fragment);
            renderPaginationControls();
        }

        function navigateToPlayer(title, streamUrl) {
            if (!streamUrl) return;
            const targetUrl = `/play.html?title=${(title)}`;
            window.location.href = targetUrl;
        }

        // Search with Debounce for Performance
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            
            // Show loading icon briefly during search
            document.querySelector('.fa-search').classList.replace('fa-search', 'fa-spinner');
            document.querySelector('.fa-spinner').classList.add('fa-spin');

            searchTimeout = setTimeout(() => {
                const term = e.target.value.toLowerCase().trim();
                
                if(term === '') {
                    filteredData = [...allVideoData];
                } else {
                    // Fast filter
                    filteredData = allVideoData.filter(v => v.title.toLowerCase().includes(term));
                }
                
                currentPage = 1;
                calculatePagination();
                handlePageChange();

                // Restore icon
                document.querySelector('.fa-spinner').classList.replace('fa-spinner', 'fa-search');
                document.querySelector('.fa-search').classList.remove('fa-spin');
            }, 350); // 350ms debounce
        });

        // Initialize on Load
        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification</title>
    <style>
        body { font-family: Arial, sans-serif; background: #141414; color: white; margin: 0; min-height: 100vh; }

        /* Full-screen overlay used for BOTH the age question and the locked state */
        .age-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .age-modal {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 32px 28px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .age-modal h2 {
            margin: 0 0 12px;
            font-size: 22px;
        }

        .age-modal p {
            font-size: 14px;
            color: #bbb;
            margin: 0 0 24px;
            line-height: 1.6;
        }

        .age-btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .age-btn {
            flex: 1;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .age-btn.yes { background: #e50914; color: white; }
        .age-btn.yes:hover { background: #b80710; }

        .age-btn.no { background: #333; color: white; }
        .age-btn.no:hover { background: #444; }

        .age-disclaimer {
            font-size: 11px;
            color: #777;
            margin-top: 18px;
        }

        /* Locked state styling */
        .locked-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .locked-title {
            color: #e50914;
        }

        /* Rest of the site content — hidden until age is confirmed */
        .site-content { padding: 40px; text-align: center; }
    </style>
</head>
<body>

<!-- Age verification / locked overlay. This same block, when copied to any page,
     will re-check the same localStorage flags and lock that page too. -->
<div class="age-overlay" id="ageOverlay">
    <!-- Content is filled in by JS depending on state: question vs locked -->
    <div class="age-modal" id="ageModal"></div>
</div>

<!-- Example site content, hidden behind the popup until verified -->
<div class="site-content" id="siteContent" style="display:none;">
    <h1>Welcome</h1>
    <p>Age has been verified. You can now view the site.</p>
</div>

<script>
    const ageOverlay = document.getElementById('ageOverlay');
    const ageModal = document.getElementById('ageModal');
    const siteContent = document.getElementById('siteContent');

    const STORAGE_KEY_VERIFIED = "age_verified_18plus";
    const STORAGE_KEY_DENIED = "age_denied_under18";

    // Detect known search engine crawlers so Google (and other bots) can still
    // crawl/index the page normally — the age gate only applies to real visitors.
    function isSearchEngineBot() {
        const ua = navigator.userAgent || "";
        const botPatterns = [
            /Googlebot/i,
            /bingbot/i,
            /Slurp/i,          // Yahoo
            /DuckDuckBot/i,
            /Baiduspider/i,
            /YandexBot/i,
            /facebookexternalhit/i,
            /Twitterbot/i,
            /LinkedInBot/i,
            /AdsBot-Google/i,
            /Google-InspectionTool/i
        ];
        return botPatterns.some((pattern) => pattern.test(ua));
    }

    const QUESTION_HTML = `
        <h2>Age Verification</h2>
        <p>This website contains 18+ content. Are you 18 years of age or older?</p>
        <div class="age-btn-row">
            <button class="age-btn yes" id="ageYesBtn">Yes, I am 18+</button>
            <button class="age-btn no" id="ageNoBtn">No</button>
        </div>
        <div class="age-disclaimer">Clicking "No" will permanently block access to this website on this browser.</div>
    `;

    const LOCKED_HTML = `
        <div class="locked-icon">&#128274;</div>
        <h2 class="locked-title">Access Restricted</h2>
        <p>This website is disabled for users under 18.<br><br>
        Please go back or close this tab. This content is not available for you.</p>
    `;

    function showQuestion() {
        ageModal.innerHTML = QUESTION_HTML;
        ageOverlay.style.display = 'flex';
        siteContent.style.display = 'none';

        document.getElementById('ageYesBtn').addEventListener('click', () => {
            localStorage.setItem(STORAGE_KEY_VERIFIED, "true");
            ageOverlay.style.display = 'none';
            siteContent.style.display = 'block';
        });

        document.getElementById('ageNoBtn').addEventListener('click', () => {
            localStorage.setItem(STORAGE_KEY_DENIED, "true");
            localStorage.removeItem(STORAGE_KEY_VERIFIED);
            showLocked();
        });
    }

    function showLocked() {
        ageModal.innerHTML = LOCKED_HTML;
        ageOverlay.style.display = 'flex';
        siteContent.style.display = 'none';
    }

    function showSite() {
        ageOverlay.style.display = 'none';
        siteContent.style.display = 'block';
    }

    // On every page load: bots get the site directly (no gate, no lock).
    // Real visitors go through the normal verified / denied / question flow.
    if (isSearchEngineBot()) {
        showSite();
    } else if (localStorage.getItem(STORAGE_KEY_DENIED) === "true") {
        // Permanently locked — this will also lock any other page that includes this same script.
        showLocked();
    } else if (localStorage.getItem(STORAGE_KEY_VERIFIED) === "true") {
        showSite();
    } else {
        showQuestion();
    }
</script>

</body>
</html>
